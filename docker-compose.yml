services:
  evidence-hub:
    image: node:20-slim
    container_name: evidence-hub-local
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
      - wrangler_state:/app/src/Worker/.wrangler
      - local_data:/app/local_storage
    ports:
      - "${PORT_FRONTEND:-8080}:8080"
      - "${PORT_BACKEND:-8787}:8787"
    environment:
      - LEXWARE_API_KEY=${LEXWARE_API_KEY:-""}
      - RESEND_API_KEY=${RESEND_API_KEY:-""}
      - JWT_SECRET=${JWT_SECRET:-"local-secure-fallback-secret-key-32chars"}
      - NODE_ENV=development
    command: >
      sh -c "
        cd /app/src/Worker &&
        npm install &&
        npx wrangler dev --local --port 8787 --ip 0.0.0.0 &
        npx serve /app/src/Web -l 8080
      "

volumes:
  local_data:
  wrangler_state:
