name: Check Cloudflare Update
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix src/Worker
      - run: npm run typecheck --prefix src/Worker
      - run: npm test
      - run: npm run build:release
      - run: git diff --exit-code -- src/Worker/bundle
