name: Update Cloudflare (Worker & Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: actanex-cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix src/Worker
      - run: npm run typecheck --prefix src/Worker
      - run: npm test
      - name: Verify committed release artifacts
        run: |
          npm run build:release
          git diff --exit-code -- src/Worker/bundle
      - name: Update existing instance and verify release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
          ACTANEX_MODE: ${{ vars.ACTANEX_MODE || 'pages' }}
          ACTANEX_WORKER: ${{ vars.ACTANEX_WORKER || 'actanex-open-worker' }}
          ACTANEX_DATABASE: ${{ vars.ACTANEX_DATABASE || 'actanex-open-db' }}
          ACTANEX_BUCKET: ${{ vars.ACTANEX_BUCKET || 'actanex-open-storage' }}
          ACTANEX_PAGES: ${{ vars.ACTANEX_PAGES || 'actanex-open-web' }}
        run: node scripts/update-cloudflare.cjs
      - name: Save recovery information
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-update-recovery-${{ github.sha }}
          path: output/update-recovery/result.json
          if-no-files-found: ignore
          retention-days: 7
