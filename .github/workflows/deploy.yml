name: Update Cloudflare (Worker & Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      worker:
        description: Existing Worker name (empty uses repository default)
        type: string
        required: false
      database:
        description: Existing D1 database name
        type: string
        required: false
      bucket:
        description: Existing R2 bucket name
        type: string
        required: false
      mode:
        description: Deployment layout
        type: choice
        options: [pages, standalone]
        default: pages
      pages:
        description: Existing Pages project name (Pages mode only)
        type: string
        required: false

concurrency:
  group: actanex-cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix src/Worker
      - run: npm run typecheck --prefix src/Worker
      - run: npm test
      - name: Verify committed release artifacts
        run: |
          npm run build:release
          node scripts/check-release.cjs
      - name: Update existing instance and verify release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
          ACTANEX_MODE: ${{ inputs.mode || vars.ACTANEX_MODE || 'pages' }}
          ACTANEX_WORKER: ${{ inputs.worker || vars.ACTANEX_WORKER || 'actanex-open-worker' }}
          ACTANEX_DATABASE: ${{ inputs.database || vars.ACTANEX_DATABASE || 'actanex-open-db' }}
          ACTANEX_BUCKET: ${{ inputs.bucket || vars.ACTANEX_BUCKET || 'actanex-open-storage' }}
          ACTANEX_PAGES: ${{ inputs.pages || vars.ACTANEX_PAGES || 'actanex-open-web' }}
        run: node scripts/update-cloudflare.cjs
      - name: Verify public installer discovery in the hosted Workers runtime
        if: ${{ !inputs.worker && !vars.ACTANEX_WORKER }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
        run: node scripts/check-hosted-installer.cjs
      - name: Save recovery information
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-update-recovery-${{ github.sha }}
          path: output/update-recovery/result.json
          if-no-files-found: ignore
          retention-days: 7
