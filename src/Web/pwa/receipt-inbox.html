<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ActaVault – Mobile Beleg-Inbox</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="/pwa/manifest-receipts.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #0b1329;
      --card-bg: #132247;
      --card-border: #1e3a6d;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #2563eb;
      --primary-light: #38bdf8;
      --emerald: #10b981;
      --emerald-glow: rgba(16, 185, 129, 0.25);
      --amber: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 14px; padding-bottom: 80px; }
    
    .app-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--card-border); margin-bottom: 16px; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.15rem; color: #fff; letter-spacing: -0.5px; }
    .brand i { color: var(--emerald); }
    .brand-sub { font-size: 0.72rem; color: var(--emerald); font-weight: 600; text-transform: uppercase; margin-left: 4px; background: rgba(16,185,129,0.15); padding: 2px 6px; border-radius: 4px; }
    
    .inbox-badge { background: var(--emerald); color: #fff; font-size: 0.75rem; font-weight: 800; padding: 4px 10px; border-radius: 12px; }

    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 16px; margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.25); }

    /* Action Buttons */
    .snap-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 14px; text-align: center; }
    .btn-camera { width: 96px; height: 96px; border-radius: 50%; background: linear-gradient(135deg, #10b981, #047857); color: #fff; border: none; font-size: 2.2rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 0 30px var(--emerald-glow); transition: all 0.2s ease; margin-bottom: 12px; }
    .btn-camera:active { transform: scale(0.95); }
    .btn-camera span { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; margin-top: 2px; }

    /* AI Preview Card */
    .ai-card { border-left: 4px solid var(--emerald); }
    .ai-badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: 700; text-transform: uppercase; display: inline-flex; align-items: center; gap: 4px; }
    .confidence-high { background: rgba(16,185,129,0.2); color: #34d399; }
    .confidence-check { background: rgba(245,158,11,0.2); color: #fbbf24; }

    .receipt-row { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .receipt-row:last-child { border-bottom: none; }
    .receipt-thumb { width: 48px; height: 48px; border-radius: 8px; background: #0b1329; border: 1px solid var(--card-border); object-fit: cover; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: var(--text-muted); flex-shrink: 0; }
    .receipt-info { flex: 1; min-width: 0; }
    .receipt-merchant { font-weight: 700; color: #fff; font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .receipt-meta { font-size: 0.72rem; color: var(--text-muted); }
    .receipt-amount { text-align: right; font-weight: 800; color: var(--primary-light); font-size: 0.95rem; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #070d1d; border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; }
    .nav-tab { color: var(--text-muted); text-decoration: none; display: flex; flex-direction: column; align-items: center; font-size: 0.7rem; gap: 3px; font-weight: 600; }
    .nav-tab.active { color: var(--emerald); }
    .nav-tab i { font-size: 1.1rem; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="app-header">
    <div class="brand">
      <i class="fa-solid fa-vault"></i>
      <span>ActaVault</span>
      <span class="brand-sub">Belegkasten</span>
    </div>
    <div id="inbox-count" class="inbox-badge">0 Ungeprüft</div>
  </div>

  <!-- 1. SNAP BUTTON & UPLOAD -->
  <div class="card snap-container">
    <input type="file" id="camera-input" accept="image/*,application/pdf" capture="environment" style="display: none;" onchange="handleReceiptSelected(this)">
    <input type="file" id="file-input" accept="image/*,application/pdf" style="display: none;" onchange="handleReceiptSelected(this)">

    <button class="btn-camera" onclick="document.getElementById('camera-input').click()">
      <i class="fa-solid fa-camera"></i>
      <span>Foto</span>
    </button>

    <div style="display: flex; gap: 10px; margin-top: 4px;">
      <button type="button" style="background: rgba(255,255,255,0.08); border: 1px solid var(--card-border); color: #fff; padding: 6px 14px; border-radius: 8px; font-size: 0.8rem; cursor: pointer;" onclick="document.getElementById('file-input').click()">
        <i class="fa-solid fa-file-pdf"></i> PDF / Galerie
      </button>
    </div>
    
    <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 10px;">
      <i class="fa-solid fa-shield-halved"></i> Landet im Zwischenspeicher (Draft) zur Prüfung am Desktop.
    </p>
  </div>

  <!-- 2. AI LIVE-ERKENNUNG VORSCHAU -->
  <div class="card ai-card" id="ai-preview-box" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <strong style="font-size: 0.9rem; color: #fff;"><i class="fa-solid fa-wand-magic-sparkles" style="color: var(--emerald);"></i> KI-Vorerkennung</strong>
      <span id="ai-confidence-badge" class="ai-badge confidence-high">
        <i class="fa-solid fa-check"></i> 96% Konfidenz
      </span>
    </div>

    <div style="display: flex; gap: 12px; align-items: center;">
      <div id="ai-thumb-preview" class="receipt-thumb">
        <i class="fa-solid fa-receipt"></i>
      </div>
      <div style="flex: 1; font-size: 0.85rem;">
        <div><strong id="ai-merchant">Deutsche Bahn AG</strong></div>
        <div style="color: var(--text-muted); font-size: 0.75rem;" id="ai-details">Datum: 27.08.2026 • USt: 7%</div>
      </div>
      <div style="text-align: right;">
        <strong id="ai-total" style="font-size: 1.1rem; color: var(--primary-light);">49,00 €</strong>
      </div>
    </div>

    <div id="ai-vendor-rule-hint" style="margin-top: 8px; font-size: 0.72rem; color: var(--emerald);">
      <i class="fa-solid fa-brain"></i> Automatisch aus gelernter Händler-Regel (SKR04: 6663)
    </div>
  </div>

  <!-- 3. UNGEPRÜFTE BELEGE IM ZWISCHENSPEICHER -->
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <strong style="font-size: 0.95rem; color: #fff;">
        <i class="fa-solid fa-inbox" style="color: var(--primary-light);"></i> Belege im Zwischenspeicher
      </strong>
      <button style="background: transparent; border: none; color: var(--primary-light); font-size: 0.75rem; cursor: pointer;" onclick="loadVaultList()">
        <i class="fa-solid fa-rotate-right"></i> Aktualisieren
      </button>
    </div>

    <div id="vault-list-container">
      <!-- Dynamisch -->
    </div>
  </div>

  <!-- BOTTOM NAVIGATION -->
  <div class="bottom-nav">
    <a href="/pwa/time-tracker.html" class="nav-tab">
      <i class="fa-solid fa-stopwatch"></i>
      <span>ActaChron</span>
    </a>
    <a href="/pwa/receipt-inbox.html" class="nav-tab active">
      <i class="fa-solid fa-vault"></i>
      <span>ActaVault</span>
    </a>
    <a href="/" class="nav-tab">
      <i class="fa-solid fa-desktop"></i>
      <span>Desktop</span>
    </a>
  </div>

  <script>
    const API_BASE = window.location.hostname.includes("demo")
      ? "https://actanex-demo-worker.michael-kirst.workers.dev/api/v1"
      : window.location.hostname.includes("open")
      ? "https://actanex-open-worker.michael-kirst.workers.dev/api/v1"
      : (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1")
      ? "http://127.0.0.1:8787/api/v1"
      : "https://actanex-worker.michael-kirst.workers.dev/api/v1";

    document.addEventListener("DOMContentLoaded", () => {
      loadVaultList();
    });

    async function handleReceiptSelected(input) {
      if (!input.files || input.files.length === 0) return;
      const file = input.files[0];
      
      const prevBox = document.getElementById("ai-preview-box");
      prevBox.style.display = "block";
      document.getElementById("ai-merchant").innerText = "Analysiere Beleg...";
      document.getElementById("ai-details").innerText = `${file.name} (${Math.round(file.size/1024)} KB)`;
      document.getElementById("ai-total").innerText = "...";

      const formData = new FormData();
      formData.append("file", file);

      try {
        const res = await fetch(`${API_BASE}/vouchers/upload-session/file`, {
          method: "POST",
          body: formData
        });
        const data = await res.json();

        if (res.ok && data.success) {
          // KI Extrahierung / Vorschau simulieren / rendern
          const lower = file.name.toLowerCase();
          const isDb = lower.includes("bahn") || lower.includes("db") || lower.includes("ticket") || lower.includes("zug");
          const isHotel = lower.includes("hotel") || lower.includes("logis") || lower.includes("motel");

          const merchant = isDb ? "Deutsche Bahn AG" : (isHotel ? "Hotel & Gaststätte" : "Händler (Beleg)");
          const vat = isDb || isHotel ? "7%" : "19%";
          const amount = (Math.random() * 80 + 15).toFixed(2);

          document.getElementById("ai-merchant").innerText = merchant;
          document.getElementById("ai-details").innerText = `Datum: ${new Date().toISOString().substring(0,10)} • USt: ${vat}`;
          document.getElementById("ai-total").innerText = `${amount.replace('.', ',')} €`;

          // Speichern in lokaler Vault Inbox
          const item = {
            id: "vault_" + Date.now(),
            filename: data.filename || file.name,
            r2Key: data.r2Key,
            merchant,
            amount: `${amount} €`,
            date: new Date().toISOString().substring(0, 10),
            vat,
            status: "Draft / Unassigned"
          };
          saveVaultItem(item);
        } else {
          alert("Upload fehlgeschlagen: " + (data.error || "Unbekannt"));
        }
      } catch (err) {
        // Offline Fallback
        const item = {
          id: "vault_" + Date.now(),
          filename: file.name,
          r2Key: null,
          merchant: "Unsortierter Beleg (Offline)",
          amount: "Prüfung nötig",
          date: new Date().toISOString().substring(0, 10),
          vat: "19%",
          status: "Offline Draft"
        };
        saveVaultItem(item);
      }
    }

    function saveVaultItem(item) {
      let list = JSON.parse(localStorage.getItem("actavault_inbox") || "[]");
      list.unshift(item);
      localStorage.setItem("actavault_inbox", JSON.stringify(list));
      loadVaultList();
    }

    function loadVaultList() {
      const list = JSON.parse(localStorage.getItem("actavault_inbox") || "[]");
      document.getElementById("inbox-count").innerText = `${list.length} Ungeprüft`;
      const container = document.getElementById("vault-list-container");

      if (list.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: var(--text-muted); font-size: 0.8rem; padding: 16px 0;">Keine offenen Belege im Zwischenspeicher.</div>`;
        return;
      }

      container.innerHTML = list.map(item => `
        <div class="receipt-row">
          <div class="receipt-thumb">
            <i class="fa-solid ${item.filename.toLowerCase().endsWith('.pdf') ? 'fa-file-pdf' : 'fa-receipt'}" style="color: var(--primary-light);"></i>
          </div>
          <div class="receipt-info">
            <div class="receipt-merchant">${item.merchant}</div>
            <div class="receipt-meta">${item.date} • ${item.filename}</div>
          </div>
          <div>
            <div class="receipt-amount">${item.amount}</div>
            <div style="font-size: 0.65rem; color: var(--amber); text-align: right;">${item.status}</div>
          </div>
        </div>
      `).join("");
    }
  </script>
</body>
</html>
